    <!-- JSON-LD: FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Does SentinelEHR store or transmit patient data (PHI)?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. SentinelEHR analyzes behavioral metadata only — who accessed what, when, and how often. Patient record content never leaves your Epic environment. The hospital owns and controls all data; SentinelEHR only sees access patterns. This is the core of our architecture, not a policy promise."
          }
        },
        {
          "@type": "Question",
          "name": "What Epic tables does SentinelEHR access?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "SentinelEHR reads from system metadata tables: CLARITY_EMP (employee reference), PAT_ENC (encounter/provider relationships), and ACCESS_LOG (the Epic audit log). It does not access CLARITY.PATIENT, clinical notes, diagnoses, medications, or any table containing clinical content. Your IT director can verify this by reading the open-source clarity_extractor.py script before deployment."
          }
        },
        {
          "@type": "Question",
          "name": "How long does setup take?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Initial deployment: 2-4 hours for IT to deploy the extractor script and verify the connection. Calibration period: 7-14 days for the ML model to learn your hospital's specific access patterns. After calibration, full operational use. Rule-based detection (R1-R8) is reliable from day one."
          }
        },
        {
          "@type": "Question",
          "name": "How does SentinelEHR support HIPAA audit control requirements?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "SentinelEHR supports HIPAA §164.312(b) audit control workflows through: documented access pattern monitoring, forensically defensible audit trails with actor/timestamp/justification, breach notification clock tracking, and exportable investigation reports. The no clinical content extraction architecture reduces the HIPAA surface area significantly — no clinical content leaves your environment."
          }
        },
        {
          "@type": "Question",
          "name": "We have a small compliance team. Is this tool right for us?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. SentinelEHR is designed for compliance teams of 1-3 people, not enterprise SOC teams. The Morning Briefing surfaces your top 5 cases for the day. The case file includes pre-built explanations so you don't need a data analyst to interpret alerts. One person can review 30+ alerts per day with this tool — without it, the same person might review 5."
          }
        },
        {
          "@type": "Question",
          "name": "What is your pricing model?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "For design partner phase, no cost — we work with you to validate the product against your environment. Post-design-partner pricing varies by hospital size, deployment scale, and support tier. We design our pricing to be accessible to community hospitals and FQHCs, not just large enterprise systems. A typical community hospital deployment is a fraction of the cost of a single HIPAA compliance audit, and a single caught insider violation that SentinelEHR surfaces can prevent OCR fines that begin at $100 per violation per day. Reach out to hello@sentinelhr.org for a conversation about what makes sense for your organization."
          }
        }
      ]
    }
